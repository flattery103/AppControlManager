name: Build AppControl Manager Windows Agent
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent/installer version to build'
        required: true
        default: '1.0.0-rc.5'
  push:
    paths:
      - 'windows-agent/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run Windows core behavior tests
        shell: powershell
        run: dotnet run --project .\windows-agent\tests\AppGuard.Core.BehaviorTests\AppGuard.Core.BehaviorTests.csproj -c Release
      - name: Run installed-policy validation behavior tests
        shell: powershell
        run: .\.github\tests\Test-InstalledPolicyValidation.ps1
      - name: Run worker rule-selection behavior tests
        shell: powershell
        run: .\.github\tests\Test-WorkerRuleSelection.ps1
      - name: Build self-contained x64 agent, update package and installer
        shell: powershell
        run: .\windows-agent\Build.ps1 -Version "${{ github.event.inputs.version || '1.0.0-rc.5' }}"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppControlManager-${{ github.event.inputs.version || '1.0.0-rc.5' }}-Windows-x64
          path: |
            windows-agent/publish/**
            windows-agent/scripts/**
            windows-agent/Install-Agent.ps1
            windows-agent/Upgrade-Agent.ps1
            windows-agent/Uninstall-Agent.ps1
