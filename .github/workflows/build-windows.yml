name: Build AppControl Manager Windows Agent
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent/installer version to build'
        required: true
        default: '0.17.0'
  push:
    paths:
      - 'windows-agent/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained x64 agent, update package and installer
        shell: powershell
        run: .\windows-agent\Build.ps1 -Version "${{ github.event.inputs.version || '0.17.0' }}"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppControlManager-${{ github.event.inputs.version || '0.17.0' }}-Windows-x64
          path: |
            windows-agent/publish/**
            windows-agent/scripts/**
            windows-agent/Install-Agent.ps1
            windows-agent/Upgrade-Agent.ps1
            windows-agent/Uninstall-Agent.ps1
