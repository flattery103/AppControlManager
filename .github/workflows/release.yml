name: Publish AppControl Manager Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Unable to determine release version from tag.' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows agent and installer
        shell: powershell
        run: .\windows-agent\Build.ps1 -Version "$env:VERSION"

      - name: Build source ZIP and checksums
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $source = "release/AppControlManager-$env:VERSION-source.zip"
          git archive --format=zip --prefix="AppControlManager-$env:VERSION/" -o $source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
          "$hash  AppControlManager-$env:VERSION-source.zip" | Set-Content -LiteralPath "$source.sha256" -Encoding ascii

          Copy-Item "windows-agent/publish/Packages/AppControlManager-Agent-$env:VERSION-win-x64.zip" release/
          Copy-Item "windows-agent/publish/Packages/AppControlManager-Agent-$env:VERSION-win-x64.zip.sha256" release/
          Copy-Item "windows-agent/publish/Installer/AppControlManager-Installer-$env:VERSION.exe" release/
          Copy-Item "windows-agent/publish/Installer/AppControlManager-Installer-$env:VERSION.exe.sha256" release/

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          & gh release create "${{ github.ref_name }}" @assets --title "AppControl Manager $env:VERSION" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
